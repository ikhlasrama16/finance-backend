services:
  db:
    image: postgres:16-alpine
    container_name: finance-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mikhlasr7A
      POSTGRES_DB: finance
    volumes:
      - postgres_data:/var/lib/postgresql/data

  finance-api:
    build: .
    container_name: finance-api
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8080"
    depends_on:
      - db

  finance-web:
    build: ../kash-flow
    container_name: finance-web
    restart: unless-stopped
    environment:
      - INTERNAL_API_URL=http://finance-api:8080
      - AUTH_SECRET=my-custom-super-secret-key-32-chars-long
      - ADMIN_PASSWORD=admin123
      - NODE_ENV=production
      - PORT=3000
    expose:
      - "3000"
    depends_on:
      - finance-api

  caddy:
    image: caddy:2
    container_name: caddy-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - finance-api
      - finance-web

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
